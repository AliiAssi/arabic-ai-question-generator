<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Concurrent Users</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #667eea 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 75% 75%, rgba(118, 75, 162, 0.2) 0%, transparent 50%);
            animation: backgroundPulse 20s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes backgroundPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(180deg); }
        }

        .dashboard {
            max-width: 1250px;
            margin: 0 auto;
            animation: dashboardSlideIn 1s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes dashboardSlideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #8b5fbf 100%);
            color: white;
            padding: 35px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
            backdrop-filter: blur(20px);
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: headerShimmer 4s infinite;
            transform: rotate(45deg);
        }

        @keyframes headerShimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); }
            to { text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3), 0 0 20px rgba(255, 255, 255, 0.4); }
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.6s;
        }

        .stat-card:hover::before {
            left: 100%;
        }

        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(102, 126, 234, 0.2);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            animation: numberPulse 2s ease-in-out infinite;
        }

        @keyframes numberPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .stat-label {
            color: #666;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: containerFadeIn 0.8s ease-out 0.5s both;
        }

        @keyframes containerFadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .chart-container h3 {
            color: #333;
            font-weight: 700;
            font-size: 1.4rem;
            margin-bottom: 25px;
        }

        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .refresh-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .refresh-btn:hover::before {
            left: 100%;
        }

        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
            background: linear-gradient(135deg, #7b8ceb 0%, #8759a3 100%);
        }

        .refresh-btn:active {
            transform: translateY(-1px);
        }

        .last-updated {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .auto-refresh label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            font-size: 1rem;
        }

        .auto-refresh input[type="checkbox"] {
            transform: scale(1.2);
            accent-color: #667eea;
        }

        .chart-circles {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .chart-item {
            text-align: center;
            flex: 1;
            min-width: 120px;
        }

        .chart-circle {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            margin: 0 auto;
            position: relative;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            animation: circleFloat 3s ease-in-out infinite;
        }

        @keyframes circleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .chart-circle:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        #chart1Min {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation-delay: 0s;
        }

        #chart5Min {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #764ba2 0%, #8b5fbf 100%);
            animation-delay: 0.5s;
        }

        #chart15Min {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            animation-delay: 1s;
        }

        #chart30Min {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #38ef7d 0%, #11998e 100%);
            animation-delay: 1.5s;
        }

        .chart-label {
            margin-top: 15px;
            font-size: 1rem;
            color: #333;
            font-weight: 600;
        }

        .loading {
            animation: loadingPulse 1.5s infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .dashboard {
                padding: 0 10px;
            }

            .header {
                padding: 25px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .stats-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .stat-card {
                padding: 25px;
            }

            .stat-number {
                font-size: 2.5rem;
            }

            .chart-circles {
                justify-content: center;
                gap: 15px;
            }

            .auto-refresh {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            #chart1Min { width: 60px; height: 60px; }
            #chart5Min { width: 75px; height: 75px; }
            #chart15Min { width: 90px; height: 90px; }
            #chart30Min { width: 105px; height: 105px; }
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>Concurrent Users Dashboard</h1>
            <p>Real-time monitoring of website users</p>
        </div>

        <div class="auto-refresh">
            <label>
                <input type="checkbox" id="autoRefresh" checked > Auto-refresh every 30 seconds
            </label>
            <button class="refresh-btn" style="margin-top: 30px;" onclick="loadStats()">Refresh Now</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">-</div>
                <div class="stat-label">Total Active Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="usersLastMin">-</div>
                <div class="stat-label">Active Last 1 Minute</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="usersLast5Min">-</div>
                <div class="stat-label">Active Last 5 Minutes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="uniqueIps">-</div>
                <div class="stat-label">Unique IP Addresses</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalRequests">-</div>
                <div class="stat-label">Total Requests</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pageViews">-</div>
                <div class="stat-label">Page Views</div>
            </div>
        </div>

        <div class="chart-container">
            <h3>User Activity by Time Frame</h3>
            <div class="chart-circles">
                <div class="chart-item">
                    <div class="chart-circle" id="chart1Min">-</div>
                    <div class="chart-label">Last 1 Min</div>
                </div>
                <div class="chart-item">
                    <div class="chart-circle" id="chart5Min">-</div>
                    <div class="chart-label">Last 5 Min</div>
                </div>
                <div class="chart-item">
                    <div class="chart-circle" id="chart15Min">-</div>
                    <div class="chart-label">Last 15 Min</div>
                </div>
                <div class="chart-item">
                    <div class="chart-circle" id="chart30Min">-</div>
                    <div class="chart-label">Last 30 Min</div>
                </div>
            </div>
        </div>

        <div class="last-updated" id="lastUpdated">
            Last updated: Never
        </div>
    </div>

    <script>
        let autoRefreshInterval;

        async function loadStats() {
            try {
                // Add loading animation
                const statNumbers = document.querySelectorAll('.stat-number');
                const chartCircles = document.querySelectorAll('.chart-circle');
                
                [...statNumbers, ...chartCircles].forEach(el => {
                    el.classList.add('loading');
                });

                const response = await fetch('/stats');
                const data = await response.json();
                
                // Simulate slight delay for better UX
                setTimeout(() => {
                    // Update stat cards
                    document.getElementById('totalUsers').textContent = data.total_active_users;
                    document.getElementById('usersLastMin').textContent = data.users_by_timeframe.last_1_min;
                    document.getElementById('usersLast5Min').textContent = data.users_by_timeframe.last_5_min;
                    document.getElementById('uniqueIps').textContent = data.unique_ips;
                    document.getElementById('totalRequests').textContent = data.total_requests;
                    document.getElementById('pageViews').textContent = data.total_page_views;

                    // Update charts
                    document.getElementById('chart1Min').textContent = data.users_by_timeframe.last_1_min;
                    document.getElementById('chart5Min').textContent = data.users_by_timeframe.last_5_min;
                    document.getElementById('chart15Min').textContent = data.users_by_timeframe.last_15_min;
                    document.getElementById('chart30Min').textContent = data.users_by_timeframe.last_30_min;

                    // Update timestamp
                    const now = new Date().toLocaleString();
                    document.getElementById('lastUpdated').textContent = `Last updated: ${now}`;

                    // Remove loading animation
                    [...statNumbers, ...chartCircles].forEach(el => {
                        el.classList.remove('loading');
                    });
                }, 300);

            } catch (error) {
                console.error('Error loading stats:', error);
                
                // Remove loading animation on error
                const statNumbers = document.querySelectorAll('.stat-number');
                const chartCircles = document.querySelectorAll('.chart-circle');
                [...statNumbers, ...chartCircles].forEach(el => {
                    el.classList.remove('loading');
                });
            }
        }

        function toggleAutoRefresh() {
            const checkbox = document.getElementById('autoRefresh');
            
            if (checkbox.checked) {
                autoRefreshInterval = setInterval(loadStats, 30000); // 30 seconds
            } else {
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                }
            }
        }

        // Initialize
        document.getElementById('autoRefresh').addEventListener('change', toggleAutoRefresh);
        loadStats(); // Load initial data
        toggleAutoRefresh(); // Start auto-refresh if enabled
    </script>
</body>
</html>
